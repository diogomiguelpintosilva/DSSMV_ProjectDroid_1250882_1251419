plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.atividadesfisicas'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.atividadesfisicas"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AndroidX e Material (Activities, componentes e tema)
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity

    // Mapa (OpenStreetMap, sem chave de API)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Vídeo: métricas sobrepostas aos vídeos e vídeo resumo (Media3 Transformer)
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-effect:1.3.1'
    implementation 'androidx.media3:media3-transformer:1.3.1'

    // Testes
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}