# Definições do Gradle para todo o projeto.
# As definições feitas no Android Studio sobrepõem-se às deste ficheiro.
# Mais informação: http://www.gradle.org/docs/current/userguide/build_environment.html

# Memória máxima do processo do Gradle e codificação dos ficheiros (UTF-8, por causa dos acentos).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilação em paralelo (desativada).
# org.gradle.parallel=true
